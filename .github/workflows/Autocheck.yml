# 工作流名称
name: 检查更新

# 定义触发条件
on:
  # 允许手动触发工作流
  workflow_dispatch:
  # 定时执行，每天 23:00 UTC 触发
  schedule:
    - cron: "0 23 * * *"

permissions: {}

jobs:
  check:
    name: ${{ matrix.dir }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    # 定义策略
    strategy:
      # 设置为 false 时，当前矩阵中的其他任务不会因为单个任务失败而取消
      fail-fast: false
      # 限制同时运行的任务数量为1，即逐个运行
      # 防止有多个更新出现时git push冲突
      max-parallel: 1
      # 定义矩阵参数
      matrix:
        include: 
          # 不加latest表示使用测试版本
          - dir: mindustry
            repo: Anuken/Mindustry
            release_scope: releases

          - dir: ntpd-rs
            repo: pendulum-project/ntpd-rs
            release_scope: releases/latest

          - dir: oxidns
            repo: svenshi/oxidns
            release_scope: releases/latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 获取版本号并比较
        id: compare
        run: |
          # 获取最新版本号和commit id
          latest_tag=$(curl -sL "https://api.github.com/repos/${{ matrix.repo }}/${{ matrix.release_scope }}?per_page=1" | jq  -r '[.. | .tag_name? | select(. !=null)] | .[0] // empty')
          if [ -z "$latest_tag" ]; then
           echo "❌ 获取${{ matrix.dir }}最新版本号失败！"
           exit 1
          else
            echo "${{ matrix.dir }}最新版本号: $latest_tag"
          fi

          latest_commit=$(curl -sL "https://api.github.com/repos/${{ matrix.repo }}/commits/$latest_tag"| jq -r '.sha')
          if [[ "$latest_commit" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "${{ matrix.dir }}最新commit id: $latest_commit"
          else
            echo "❌ 获取${{ matrix.dir }}最新commit id失败！无效SHA: $latest_commit"
            exit 1
          fi

          # 获取本地版本号
          local_tag=$(grep -oP -m1 'ARG APP_VERSION="\K[^"]+' ${{ matrix.dir }}/Dockerfile || echo "")
          if [ -z "$local_tag" ]; then
            echo "❌ 获取${{ matrix.dir }}本地版本号失败！"
          else
            echo "${{ matrix.dir }}本地版本号: $local_tag"
          fi

          # 获取本地commit id
          local_commit=$(grep -oP -m1 'ARG APP_COMMIT="\K[0-9a-fA-F]{40}(?=")' ${{ matrix.dir }}/Dockerfile || echo "")
          if [ -z "$local_commit" ]; then
            echo "❌ 获取${{ matrix.dir }}本地commit id失败！"
          else
            echo "${{ matrix.dir }}本地commit id: $local_commit"
          fi

          if [ -n "$latest_tag" ] && [ -n "$latest_commit" ] && [ -n "$local_tag" ] && [ -n "$local_commit" ] && [ "$latest_tag" != "$local_tag" ]; then
            echo "latest_tag=$latest_tag" >> $GITHUB_OUTPUT
            echo "latest_commit=$latest_commit" >> $GITHUB_OUTPUT
            echo "local_tag=$local_tag" >> $GITHUB_OUTPUT
            echo "local_commit=$local_commit" >> $GITHUB_OUTPUT
            echo "${{ matrix.dir }}有新版本：本地[$local_tag] --- 远程[$latest_tag]"
            echo "has_new_version=true" >> $GITHUB_OUTPUT
          else
            echo "${{ matrix.dir }}没有新版本"
          fi

      - name: 更新版本并提交
        if: steps.compare.outputs.has_new_version == 'true'
        run: |
          # 同步远程仓库
          git pull  
          echo "更新${{ matrix.dir }}版本: ${{ steps.compare.outputs.local_tag }} → ${{ steps.compare.outputs.latest_tag }}"

          # 写入新tag到Dockerfile
          sed -i "s/^ARG APP_VERSION=\"${{ steps.compare.outputs.local_tag }}\"/ARG APP_VERSION=\"${{ steps.compare.outputs.latest_tag }}\"/g" ${{ matrix.dir }}/Dockerfile

          # 写入新commit id到Dockerfile
          sed -i "s/^ARG APP_COMMIT=\"${{ steps.compare.outputs.local_commit }}\"/ARG APP_COMMIT=\"${{ steps.compare.outputs.latest_commit }}\"/g" ${{ matrix.dir }}/Dockerfile

          # 提交变更
          echo "提交版本更新"
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add ${{ matrix.dir }}/Dockerfile

          # 构建更直观的 commit message
          commit_subject="chore(${{ matrix.dir }}): update version"
          commit_body1="${{ matrix.dir }}: ${{ steps.compare.outputs.local_tag }} → ${{ steps.compare.outputs.latest_tag }}"
          commit_body2="(old commit id: ${{ steps.compare.outputs.local_commit }})"
          commit_body3="(new commit id: ${{ steps.compare.outputs.latest_commit }})"

          # 使用格式化的提交消息
          git commit -m "$commit_subject" -m "$commit_body1" -m "$commit_body2" -m "$commit_body3"
          git push
          echo "版本更新已提交"

      - name: 触发构建工作流
        if: steps.compare.outputs.has_new_version == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            console.log('准备触发自动构建工作流...');
            try {
              // 调用 GitHub API 触发 AutoBuild.yml 工作流
              const response = await github.rest.actions.createWorkflowDispatch({
                owner: '97xiami',
                repo: 'Dockerfiles',
                workflow_id: 'AutoBuild.yml',
                ref: 'main',
                inputs: {
                  repo: '${{ matrix.dir }}',
                  ver: '${{ steps.compare.outputs.latest_tag }}'
                }
              });
              console.log('工作流触发成功:', response.status);
            } catch (error) {
              core.setFailed(`工作流触发失败: ${error}`);
              console.error('错误详情:', error);
            }
